<title>דילים מעליאקספרס</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="קבוצת וואטסאפ לדילים, קופונים ומציאות מעליאקספרס.">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff;background:#000}
.overlay{height:100vh;height:100dvh;background:radial-gradient(circle at 20% 15%,#ff9a3c55 0,transparent 40%),radial-gradient(circle at 85% 85%,#ff3d9a55 0,transparent 45%),linear-gradient(160deg,#0f2b5b,#4a1d96 55%,#c2185b);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.container{width:100%;max-width:450px;background:rgba(10,10,30,.55);border-radius:20px;padding:clamp(14px,3vh,26px) 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.badge{background:#ff7a00;color:#fff;padding:6px 16px;border-radius:20px;font-size:clamp(.8rem,2.4vh,.95rem);font-weight:700;margin-bottom:clamp(8px,2vh,16px);display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1.08);box-shadow:0 0 0 0 rgba(255,150,40,.9),0 0 22px 6px rgba(255,150,40,.9)}50%{opacity:.25;transform:scale(1);box-shadow:0 0 0 0 rgba(255,150,40,0)}}
h1{font-size:clamp(1.9rem,7vh,2.7rem);margin:0 0 clamp(8px,2vh,14px);line-height:1.1;text-shadow:0 3px 10px rgba(0,0,0,.5)}
h1 span{color:#ffd23f}
.subtitle{font-size:clamp(1rem,2.8vh,1.2rem);margin:0 0 clamp(14px,3.5vh,26px);line-height:1.5;opacity:.95}
.cta-btn{display:block;width:100%;background:#3ddc84;color:#04321a;font-size:clamp(1.2rem,3.6vh,1.5rem);padding:clamp(12px,2.6vh,18px) 20px;border-radius:12px;font-weight:800;text-decoration:none;animation:ripple 2.4s infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6);transform:scale(1)}60%{box-shadow:0 0 0 14px rgba(74,222,128,0);transform:scale(1.02)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);transform:scale(1)}}
.cta-btn:hover{background:#7af0aa}
.small-note{font-size:clamp(.8rem,2.2vh,.95rem);margin:clamp(10px,2.5vh,18px) 0 0;color:#ddd;line-height:1.6}
</style>
</head>
<body>
<main class="overlay">
<div class="container">
<div class="badge">הצייד עליאקספרס קבוצת הדילים</div>
<h1>דילים שחבל <span>לפספס.</span></h1>
<p class="subtitle">קופונים, מוצרים שווים והמציאות הכי מעניינות מעליאקספרס - ישר לוואטסאפ, בלי חפירות מיותרות.</p>
<a class="cta-btn" href="https://chat.whatsapp.com/GR5BoqZH6sV21xCO9CEtHV" target="_blank" rel="noopener">להצטרפות בחינם</a>
<p class="small-note">✓ ללא עלות • ✓ ניתן לעזוב בכל עת • ✓ רק מוצרים שווים</p>
</div>
</main>
<script>
// Measures the join-button click, not a confirmed WhatsApp group membership.
document.querySelector('.cta-btn').addEventListener('click', function () {
  if (window.ttq && typeof window.ttq.track === 'function') {
    window.ttq.track('WhatsAppJoinClick');
  }
});
</script>
</body>
